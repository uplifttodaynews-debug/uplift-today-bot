# daily.yml - tells GitHub when and how to run the bot.
# - Runs every day automatically (see "cron" below), when you press "Run workflow",
#   and when run-now.txt is changed (a quick way to start a test run).
# - All the bot's files live in this same folder (.github/workflows).
# - If a run FAILS or SKIPS the day, GitHub emails you.
name: Daily bulletin

on:
  workflow_dispatch:
  push:
    # Saving a change to the file "run-now.txt" (and ONLY that file) starts a test run.
    paths:
      - run-now.txt
  schedule:
    # Times are in UTC. "30 23 * * *" = 23:30 UTC = 5:00 AM in India (next day), 4:30 PM in California.
    # GitHub can start runs 10-30 minutes late and the video takes ~12 minutes, so it is ready
    # around 5:30-6:00 AM India time, leaving time to review it and publish at 7:00 AM.
    - cron: "30 23 * * *"

permissions:
  actions: write   # lets the keep-alive step below work
  contents: write  # lets the bot remember which stories were used

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .github/workflows
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make the bulletin (HOLD for review by default, or upload when told)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          mkdir -p ../../previews
          mode=hold
          if [ "$(head -1 ../../upload-mode.txt 2>/dev/null | tr -d '\r ')" = "upload" ]; then mode=upload; fi
          if [ "${{ github.event_name }}" = "push" ] && head -1 ../../run-now.txt | grep -qi "upload"; then mode=upload; fi
          dt=$(grep -o 'date=[0-9-]*' ../../run-now.txt 2>/dev/null | head -1 | cut -d= -f2 || true)
          if [ -n "$dt" ]; then export VIDEO_DATE="$dt"; fi
          if grep -qi "ailead" ../../run-now.txt 2>/dev/null; then export FORCE_AI_VISUALS=0; fi
          fa=$(grep -o 'forceai=[0-9,]*' ../../run-now.txt 2>/dev/null | head -1 | cut -d= -f2 || true)
          if [ -n "$fa" ]; then export FORCE_AI_VISUALS="$fa"; fi
          if grep -qiw "male" ../../run-now.txt 2>/dev/null; then export PRESENTER=male; fi
          if grep -qi "options" ../../run-now.txt 2>/dev/null; then export THUMB_OPTIONS=1; fi
          if [ "$mode" = "hold" ]; then
            echo "HOLD mode: the video is prepared for review and NOT uploaded."
            export PREVIEW_ONLY=1
            export HOLD_OUT="$PWD/../../hold_out"
          fi
          for attempt in 1 2; do
            python -u main.py 2>&1 | python redact.py | tee ../../previews/preview-log.txt
            code=${PIPESTATUS[0]}
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -eq 3 ]; then
              echo "No video today (not enough good stories). Not retrying."
              exit 3
            fi
            echo "Attempt $attempt failed. Waiting 2 minutes before trying again..."
            sleep 120
          done
          exit 1

      - name: Keep the prepared video for review/upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulletin
          path: hold_out
          retention-days: 7
          if-no-files-found: ignore

      - name: Save the review copy into the repo
        if: always()
        run: |
          cd ../..
          git config user.name "uplift-bot"
          git config user.email "uplift-bot@users.noreply.github.com"
          git add previews
          git commit -m "Preview video" || echo "nothing new"
          git checkout -- . || true
          git pull --rebase -X theirs -q || true
          git push || echo "could not save the review copy"

      - name: Remember the stories used (never repeat a story)
        if: success()
        continue-on-error: true
        run: |
          git config user.name "uplift-bot"
          git config user.email "uplift-bot@users.noreply.github.com"
          git add approval/used.json
          git commit -m "Stories used today" || echo "nothing new"
          git checkout -- . || true
          git pull --rebase -X theirs -q || true
          git push || echo "could not save the list"

      - name: Keep the daily schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily.yml --repo "$GITHUB_REPOSITORY" || echo "keep-alive skipped"
