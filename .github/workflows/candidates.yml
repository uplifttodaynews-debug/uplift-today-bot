# candidates.yml - collects positive stories and saves a short list for the owner to approve. No video, no upload.
# Start it by changing candidates-request.txt.
name: Candidate stories (no video, no upload)

on:
  workflow_dispatch:
  push:
    # Changing candidates-request.txt (and ONLY that file) starts a preview. Line 1 may be "full" or "no-kavya".
    paths:
      - candidates-request.txt

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .github/workflows
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make the preview (one attempt, nothing is uploaded)
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          mkdir -p ../../approval
          python -u candidates.py 2>&1 | python redact.py
          exit ${PIPESTATUS[0]}

      - name: Save the preview into the repo
        if: always()
        run: |
          cd ../..
          git config user.name "uplift-bot"
          git config user.email "uplift-bot@users.noreply.github.com"
          git add approval
          git commit -m "Candidate stories" || echo "nothing new"
          git pull --rebase -X theirs -q || true
          git push
