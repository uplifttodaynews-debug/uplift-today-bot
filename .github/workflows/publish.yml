# publish.yml - uploads a bulletin that was prepared earlier and approved by the owner. Always PRIVATE.
# Start it by writing the run number of the prepared build into publish-request.txt (line 1).
name: Publish the approved bulletin (private)

on:
  workflow_dispatch:
  push:
    paths:
      - publish-request.txt

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .github/workflows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch the prepared video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(head -1 ../../publish-request.txt | tr -dc '0-9')
          gh run download "$RUN_ID" -n bulletin -D ../../hold_out --repo "$GITHUB_REPOSITORY"
          ls -la ../../hold_out
      - name: Upload to YouTube (private)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -u publish.py 2>&1 | python redact.py; exit ${PIPESTATUS[0]}
      - name: Remember the stories used
        if: success()
        run: |
          cd ../..
          git config user.name "uplift-bot"
          git config user.email "uplift-bot@users.noreply.github.com"
          git add approval/used.json
          git commit -m "Stories used" || echo "nothing new"
          git checkout -- . || true
          git pull --rebase -X theirs -q || true
          git push || echo "could not save the list"
