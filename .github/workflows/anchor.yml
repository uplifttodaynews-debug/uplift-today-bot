# anchor.yml - one-off helper that creates the AI news presenter pictures.
# Runs only when anchor-request.txt is changed (or when you press "Run workflow").
name: Make anchor pictures

on:
  workflow_dispatch:
  push:
    paths:
      - anchor-request.txt

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Create pictures
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: python .github/workflows/anchor_make.py "$(head -1 anchor-request.txt | tr -d '\r')"
      - name: Save pictures into the repo
        run: |
          git config user.name "uplift-bot"
          git config user.email "uplift-bot@users.noreply.github.com"
          git add anchor
          git commit -m "Add anchor pictures" || echo "nothing new"
          git push
