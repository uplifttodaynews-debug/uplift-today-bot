# shorts.yml - makes ONE vertical Short from the lead approved story. Nothing is uploaded.
# Start it by changing shorts-request.txt.
name: Make a Short (no upload)

on:
  workflow_dispatch:
  push:
    paths:
      - shorts-request.txt

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .github/workflows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0
      - run: pip install -r requirements.txt
      - name: Make the Short
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if grep -qiw male ../../shorts-request.txt; then export PRESENTER=male; fi
          if grep -qiw english ../../shorts-request.txt; then export SHORT_SUBS=en; fi
          export SHORT_STORY=$(grep -o 'story=[0-9]*' ../../shorts-request.txt | head -1 | cut -d= -f2); SHORT_STORY=${SHORT_STORY:-1}; export SHORT_STORY
          python -u shorts.py 2>&1 | python redact.py | tee ../../previews/short-log.txt
          exit ${PIPESTATUS[0]}
      - name: Save the preview into the repo
        if: always()
        run: |
          cd ../..
          git config user.name "uplift-bot"
          git config user.email "uplift-bot@users.noreply.github.com"
          git add previews
          git commit -m "Short preview" || echo "nothing new"
          git checkout -- . || true
          git pull --rebase -X theirs -q || true
          git push || (git pull --rebase -X theirs -q && git push)
